name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Кэшируем зависимости для ускорения сборки

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install ruff==0.9.10 bandit==1.8.3

    - name: Lint with ruff
      run: |
        ruff check . --output-format=github

    - name: Security check with bandit
      run: |
        bandit -r modules/ main.py -s B101 --format txt

    - name: Run tests with pytest
      run: |
        pytest
