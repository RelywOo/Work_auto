version: '3.8'

services:
  bot:
    build: .
    container_name: work_auto_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Прокидываем базу данных и сессию, чтобы не терять при перезапуске
      - ./bot_memory.db:/app/bot_memory.db
      - ./session_name.session:/app/session_name.session
      # Прокидываем каталоги с файлами и логами
      - ./downloads:/app/downloads
      - ./output:/app/output
      - ./logs:/app/logs
    # Настройки ресурсов (опционально)
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
